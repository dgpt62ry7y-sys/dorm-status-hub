name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_CLOUDBASE_ENV_ID: ci-placeholder
      VITE_DORMSYNC_API_URL: https://example.invalid/dormsyncApi
      DORMSYNC_CREATOR_KEY: ci-placeholder-creator
      DORMSYNC_ADMIN_KEY: ci-placeholder-admin
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit root dependencies
        run: npm audit --audit-level=moderate

      - name: Install cloud function dependencies
        working-directory: cloudfunctions/api
        run: npm ci

      - name: Audit cloud function dependencies
        working-directory: cloudfunctions/api
        run: npm audit --audit-level=high

      - name: Verify release notes
        run: npm run check:release

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
