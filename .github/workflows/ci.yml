name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_CLOUDBASE_ENV_ID: ci-placeholder
      VITE_DORMSYNC_API_URL: https://example.invalid/dormsyncApi
      DORMSYNC_CREATOR_KEY: ci-placeholder-creator
      DORMSYNC_ADMIN_KEY: ci-placeholder-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release notes
        run: npm run check:release

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
