name: 功能请求
description: 描述一个使用场景或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 目前遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可选，不要求提供完整实现方案。
    validations:
      required: false
