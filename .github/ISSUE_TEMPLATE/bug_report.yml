name: Bug 报告
description: 报告可复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请勿粘贴密钥、令牌、恢复码、邀请码或真实用户数据。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要说明发生了什么。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 看到...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: 浏览器、操作系统、Node.js 版本、是否为自行部署
    validations:
      required: true
  - type: dropdown
    id: reproducible
    attributes:
      label: 是否稳定复现
      options:
        - 每次都出现
        - 偶尔出现
        - 只出现一次
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 请先移除密钥、令牌、邀请码和用户数据。
    validations:
      required: false
